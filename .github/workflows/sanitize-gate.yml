name: sanitize-gate
# 中央信号门禁(P5 强制层, 自包含版) — 模板正本: FireNirva/sanitize-gate(私有, 因个人账户
# 不支持跨仓调用私有 reusable 而内置)。敏感模式分段拼接仅为避免规则文件自污染, 人工可审。
# 拦: 节点IP/机队机械词/身份; 扫描错误同拦; CRED/语义/T2-code 为已接受残差不在此门。
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  gate:
    runs-on: [self-hosted]
    steps:
      - uses: actions/checkout@v4
      - name: run gate
        run: |
          python3 - <<'PY'
          import subprocess, sys, re
          N = [".".join(x) for x in [("16","54","8","160"),("15","175","16","57"),("3","97","192","68")]]
          ID1 = "zheng" + "jianxuan"; ID2 = "jonathanzh" + "_team"; ID3 = "jon" + "athan"
          MB = "montreal" + "-node"; CU = "cn[-_]" + "ubuntu"
          RULES = [
              ("T1A", re.compile("|".join(re.escape(i) for i in N), re.I)),
              ("T1Bm", re.compile(f"{MB}|{CU}", re.I)),
              ("T1C", re.compile(f"{ID1}|{ID2}|\\b{ID3}\\b", re.I)),
          ]
          p = subprocess.run(["git", "ls-files", "-z"], capture_output=True)
          if p.returncode != 0:
              print("GATE-ERROR ls-files rc=", p.returncode); sys.exit(2)
          files = [x.decode("utf-8","surrogateescape") for x in p.stdout.split(b"\0") if x]
          hits, errs = 0, 0
          for f in files:
              try: data = open(f, "rb").read()
              except OSError as e:
                  print(f"UNREADABLE|{f}|{type(e).__name__}"); errs += 1; continue
              text = data.decode("utf-8","surrogateescape")
              for name, rx in RULES:
                  for m in rx.finditer(text):
                      print(f"HIT|{name}|{f}:{text.count(chr(10),0,m.start())+1}"); hits += 1
          print(f"GATE|files={len(files)}|hits={hits}|errors={errs}")
          sys.exit(2 if errs else (1 if hits else 0))
          PY
